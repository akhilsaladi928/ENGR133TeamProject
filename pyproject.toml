[build-system]
requires = ["setuptools>=61.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ENGR133TeamProject"
version = "0.1.0"
description = "Machine learning project during fall 2026 ENGR 133 @ Purdue - LC4 - 18"
readme = "README.md"
requires-python = ">=3.8"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
namespaces = true
